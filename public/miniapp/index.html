<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>云枢易馆</title>
<link rel="stylesheet" href="common.css"/>
<style>
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.score-val{font-size:26px;font-weight:700;font-family:var(--font-serif)}
.score-label{font-size:10px;color:var(--sub);margin-top:2px}
.score-bar{height:3px;border-radius:2px;margin:4px 6px 0;background:var(--border-light);overflow:hidden}
.score-bar-inner{height:100%;border-radius:2px;transition:width .8s}
.info-grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.info-box{background:#faf8f5;border-radius:var(--radius-sm);padding:12px 8px;text-align:center;border:1px solid var(--border)}
.info-box .il{font-size:10px;color:var(--sub);margin-bottom:4px}
.info-box .iv{font-size:14px;font-weight:600;color:var(--primary)}
.yi-ji{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.yi,.ji{border-radius:var(--radius-sm);padding:14px;text-align:center}
.yi{background:var(--jade-light)}.ji{background:#fbe9e7}
.yi .h,.ji .h{font-family:var(--font-serif);font-size:14px;font-weight:600}
.yi .h{color:var(--jade)}.ji .h{color:var(--primary)}
.yi .tags,.ji .tags{font-size:11px;color:var(--sub);margin-top:4px}
.dayun-item{min-width:82px;text-align:center;padding:12px 10px;background:#faf8f5;border-radius:var(--radius-sm);border:1.5px solid var(--border);flex-shrink:0}
.dayun-item.cur{border-color:var(--primary);background:var(--primary-light)}
.dayun-item .da{font-size:10px;color:var(--sub)}
.dayun-item .dgz{font-family:var(--font-serif);font-size:16px;font-weight:700;color:var(--primary);margin:4px 0}
.dayun-item .dn{font-size:10px;color:var(--sub)}
.sizhu-mini{display:flex;gap:6px;justify-content:center;margin-top:6px}
.sizhu-mini span{font-family:var(--font-serif);font-size:13px;background:var(--primary-light);color:var(--primary);padding:4px 10px;border-radius:20px}
</style>
</head>
<body>
<div class="top-ornament"></div>
<div class="header">
  <h1>云 枢 易 馆</h1>
  <div class="sub">古法藏枢机 · AI 解流年</div>
</div>

<div id="hasData" style="display:none">
  <div class="card">
    <div class="card-title"><span class="icon">📊</span>今日命理指数</div>
    <div class="scores" id="scores"></div>
    <div class="yi-ji" id="yiji"></div>
    <div class="info-grid2" id="luckyRow"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="icon">📅</span>一生大运排布</div>
    <div class="scroll-x" id="dayunList"></div>
  </div>
</div>

<div id="noData" class="placeholder">
  <div class="ph-icon">🔮</div>
  <div class="ph-title">尚未录入生辰</div>
  <p style="font-size:13px;color:var(--sub);margin-top:4px">请先生成八字命盘<br>即可解锁专属运势</p>
  <a href="divine.html" style="display:inline-block;margin-top:20px;padding:12px 32px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:24px;text-decoration:none;font-family:var(--font-serif);font-size:15px">📝 开始测算 →</a>
</div>

<a href="divine.html" class="btn btn-primary" id="bottomBtn">📝 录入生辰 · 开始测算</a>

<nav class="nav">
  <a href="index.html" class="nav-item active"><span class="ni">🏠</span>运势</a>
  <a href="divine.html" class="nav-item"><span class="ni">🔮</span>测算</a>
  <a href="chat.html" class="nav-item"><span class="ni">💬</span>问答</a>
  <a href="community.html" class="nav-item"><span class="ni">📱</span>广场</a>
  <a href="profile.html" class="nav-item"><span class="ni">👤</span>我的</a>
</nav>

<script>
(function(){
  try{
    var d=JSON.parse(localStorage.getItem("yunshu:bazi-data"));
    if(!d) return;
    document.getElementById("noData").style.display="none";
    document.getElementById("bottomBtn").style.display="none";
    document.getElementById("hasData").style.display="block";

    var colors=["#c43a2f","#c49a3c","#e8615a","#7c4dff","#4a9e6e"];
    var labels=["事业","财运","情感","人际","健康"];
    var base=60+(d.qiangruo==="身强"?15:d.qiangruo==="身弱"?-3:0);
    var sh="";
    for(var i=0;i<5;i++){
      var v=Math.min(98,base+Math.floor(Math.sin(i*2.3)*12));
      sh+='<div class="score-item"><div class="score-val" style="color:'+colors[i]+'">'+v+'</div><div class="score-label">'+labels[i]+'</div><div class="score-bar"><div class="score-bar-inner" style="width:'+v+'%;background:'+colors[i]+'"></div></div></div>';
    }
    document.getElementById("scores").innerHTML=sh;

    var wy=d.xiyongshen||"";
    var lc=wy.indexOf("木")>=0?"松烟青":wy.indexOf("火")>=0?"朱砂红":wy.indexOf("水")>=0?"墨蓝":"鎏金棕";
    var ln=wy.indexOf("木")>=0?"3、8":wy.indexOf("火")>=0?"2、7":wy.indexOf("水")>=0?"1、6":"5、0";
    var ldir=wy.indexOf("木")>=0?"东方":wy.indexOf("火")>=0?"南方":wy.indexOf("金")>=0?"西方":"中央";

    document.getElementById("yiji").innerHTML=
      '<div class="yi"><div class="h">✅ 宜</div><div class="tags">出行 · 签约 · 会友 · 整理</div></div>'+
      '<div class="ji"><div class="h">❌ 忌</div><div class="tags">争辩 · 动土 · 大额消费</div></div>';

    document.getElementById("luckyRow").innerHTML=
      '<div class="info-box"><div class="il">🎨 幸运色</div><div class="iv" style="color:var(--text);font-size:13px">'+lc+'</div></div>'+
      '<div class="info-box"><div class="il">🔢 幸运数字</div><div class="iv">'+ln+'</div></div>'+
      '<div class="info-box"><div class="il">🧭 方位</div><div class="iv" style="font-size:12px">'+ldir+'</div></div>';

    var dyhtml="";
    for(var i=0;i<Math.min(d.dayuns.length,6);i++){
      var dy=d.dayuns[i];
      dyhtml+='<div class="dayun-item'+(dy.current?" cur":"")+'"><div class="da">'+dy.age+'岁</div><div class="dgz">'+dy.gz+'</div><div class="dn">'+dy.god+'</div></div>';
    }
    document.getElementById("dayunList").innerHTML=dyhtml;
  }catch(e){}
})();
</script>
</body>
</html>
