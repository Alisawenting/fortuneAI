<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>AI 问答 · 云枢易馆</title>
<link rel="stylesheet" href="common.css"/>
<style>
.msg-list{padding:12px 14px;padding-bottom:100px}
.msg{display:flex;gap:8px;margin-bottom:14px}
.msg.user{flex-direction:row-reverse}
.msg .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.msg.ai .av{background:var(--primary-light)}
.msg.user .av{background:var(--primary);color:#fff}
.msg .bub{max-width:80%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.7;word-break:break-word}
.msg.ai .bub{background:var(--card);border-top-left-radius:4px;box-shadow:var(--shadow);white-space:pre-line}
.msg.user .bub{background:var(--primary);color:#fff;border-top-right-radius:4px}
.quick-wrap{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.quick{display:inline-block;padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--sub);cursor:pointer;text-decoration:none;transition:all .15s}
.quick:active{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
.input-bar{position:fixed;bottom:60px;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 14px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--border);z-index:99}
.input-bar input{flex:1;padding:10px 16px;border:1.5px solid var(--border);border-radius:24px;font-size:14px;font-family:inherit;background:var(--bg);outline:none}
.input-bar input:focus{border-color:var(--primary)}
.input-bar button{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.typing{display:flex;gap:4px;padding:6px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="top-ornament"></div>
<div class="header-bar">
  <a href="index.html" class="back">←</a>
  <div>
    <h1 style="font-size:16px">枢机 · AI 命理师</h1>
    <div style="font-size:10px;opacity:.6" id="roleInfo">通用模式</div>
  </div>
</div>

<div class="quick-wrap" id="quickQs">
  <span class="quick" onclick="send('近期事业运势如何？')">💼 事业运势</span>
  <span class="quick" onclick="send('感情方面有什么建议？')">💕 感情建议</span>
  <span class="quick" onclick="send('财运方面如何提升？')">💰 财运提升</span>
  <span class="quick" onclick="send('最近健康需要注意什么？')">🏥 健康注意</span>
  <span class="quick" onclick="send('根据我的八字，适合做什么行业？')">🔮 适合行业</span>
  <span class="quick" onclick="send('我今年的整体运势如何？')">📊 今年运势</span>
</div>

<div class="msg-list" id="msgList">
  <div class="msg ai" id="welcomeMsg">
    <div class="av">🔮</div>
    <div class="bub">你好！我是 AI 命理师「枢机」。<br><br>请在「测算」页面录入生辰，<br>我就能结合你的八字命盘为你解读。</div>
  </div>
</div>

<div class="input-bar">
  <input type="text" id="msgInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()"/>
  <button onclick="send()">➤</button>
</div>

<nav class="nav">
  <a href="index.html" class="nav-item"><span class="ni">🏠</span>运势</a>
  <a href="divine.html" class="nav-item"><span class="ni">🔮</span>测算</a>
  <a href="chat.html" class="nav-item active"><span class="ni">💬</span>问答</a>
  <a href="community.html" class="nav-item"><span class="ni">📱</span>广场</a>
  <a href="profile.html" class="nav-item"><span class="ni">👤</span>我的</a>
</nav>

<script>
var baziData=null,history=[],API="https://yunshuyiguan.cn";

(function(){
  try{var d=JSON.parse(localStorage.getItem("yunshu:bazi-data"));if(d){baziData=d;document.getElementById("roleInfo").textContent=(d.gender||"")+" · "+d.rizhu;document.getElementById("welcomeMsg").querySelector(".bub").textContent="你好！我已加载你的命盘。\n\n八字："+d.sizhu.map(function(p){return p.g+p.z}).join(" ")+"\n格局："+d.zhengge+"\n喜用神："+d.xiyongshen+"\n\n有什么想了解的？"}}catch(e){}
})();

function addMsg(role,text){
  var div=document.createElement("div");div.className="msg "+(role==="user"?"user":"ai");
  div.innerHTML='<div class="av">'+(role==="user"?"👤":"🔮")+'</div><div class="bub">'+text.replace(/\n/g,"<br>")+'</div>';
  document.getElementById("msgList").appendChild(div);var l=document.getElementById("msgList");l.scrollTop=l.scrollHeight
}
function typing(){
  var div=document.createElement("div");div.className="msg ai";div.id="typingMsg";
  div.innerHTML='<div class="av">🔮</div><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById("msgList").appendChild(div);var l=document.getElementById("msgList");l.scrollTop=l.scrollHeight
}
function removeTyping(){var e=document.getElementById("typingMsg");if(e)e.remove()}

function send(text){
  var msg=text||document.getElementById("msgInput").value.trim();
  if(!msg)return;document.getElementById("msgInput").value="";document.getElementById("quickQs").style.display="none";
  addMsg("user",msg);typing();

  var body={message:msg,history:history.slice(-8).map(function(m){return{role:m.r,content:m.c}}),baziContext:{}};
  if(baziData){body.baziContext={name:baziData.name||"",sex:baziData.gender||"",birthDate:baziData.gongli||"",birthTime:"",sizhu:baziData.sizhu.map(function(p){return p.g+p.z}).join(" "),rizhu:baziData.rizhu||"",zhengge:baziData.zhengge||"",qiyun:"",currentDayun:"",xiyongshen:baziData.xiyongshen||"",wuxing:baziData.qiangruo||""}}

  fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return{}})})
  .then(function(data){removeTyping();if(data.reply){addMsg("ai",data.reply);history.push({r:"user",c:msg});history.push({r:"assistant",c:data.reply})}else addMsg("ai",localReply(msg))})
  .catch(function(){removeTyping();addMsg("ai",localReply(msg))})
}

function localReply(msg){
  if(!baziData) return "我是本地运行的 AI 命理师。请先去「测算」页面录入生辰，我就能结合八字命盘为你解读。\n\n（💡 AI 对话需要连接服务器才能获得更智能的回复）";
  var rizhu=baziData.rizhu,zhengge=baziData.zhengge,xy=baziData.xiyongshen,xy1=xy.split("、")[0];
  var resp={};
  resp["事业"]="📊 事业运分析\n\n日主"+rizhu+"，格局"+zhengge+"。你在职场中稳重可靠，适合深耕专业领域。\n\n喜用神「"+xy+"」提示：多关注"+xy1+"属性的行业方向，对你的发展更有利。当前流年宜稳中求进。\n\n💡 建议：发挥耐心和专注力，在现有岗位上做出成绩。";
  resp["感情"]="💕 感情运势\n\n"+rizhu+"的主星特质让你在感情中内敛、细腻。你重视精神契合，不轻易开始一段关系。\n\n喜用神「"+xy+"」暗示：多接触"+xy1+"属性的人，缘分更容易出现。已有伴侣今年宜增加共同活动。";
  resp["财"]="💰 财运分析\n\n八字中的财运稳健，适合以专业能力积累财富。格局"+zhengge+"说明财富增长需要时间沉淀。\n\n喜用神「"+xy+"」提示："+xy1+"属性的投资方向值得关注，不宜贪多求快。💡 建议：做好长期理财规划。";
  resp["健康"]="🏥 健康提示\n\n"+rizhu+"的体质整体平衡，需关注"+xy1+"属性对应的身体系统。建议规律作息，适度运动。💡 定期体检，劳逸结合。";
  resp["行业"]="🔮 职业方向\n\n格局"+zhengge+"适合"+xy1+"属性相关行业。你天生适合需要耐心深耕的领域。建议在专业领域持续积累经验。";
  resp["运势"]="📊 运势总览\n\n今年流年对"+rizhu+"命主而言，整体运势在"+xy1+"方向更有优势。建议关注"+xy.split("、")[0]+"属性的月份，把握时机。";
  for(var k in resp) if(msg.indexOf(k)>=0) return resp[k];
  return "🔮 命理解读\n\n命盘：日主"+rizhu+"，格局"+zhengge+"，五行"+baziData.qiangruo+"。\n\n喜用神「"+xy+"」。整体偏向稳重型，适合循序渐进。\n\n有什么具体方面想深入了解吗？";
}
</script>
</body>
</html>
